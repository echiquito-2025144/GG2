<div class="register-container">
  <div class="register-card">
    
    <!-- Logo SVG Incrustado -->
    <div class="logo-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" class="nexus-logo">
        <rect width="800" height="240" fill="#0B192C"/>
        <g transform="translate(60, 40)">
          <rect x="0" y="10" width="22" height="140" rx="11" fill="#E2D8B3"/>
          <path d="M 28 15 L 98 125 A 12 12 0 0 0 118 118 L 118 10 Z" fill="#E2D8B3"/>
          <rect x="126" y="30" width="22" height="120" rx="11" fill="#E2D8B3"/>
          <circle cx="137" cy="12" r="10" fill="#E2D8B3"/>
        </g>
        <text x="250" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" fill="#FFFFFF" letter-spacing="4">NEXUS</text>
        <text x="440" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="300" font-size="46" fill="#E2D8B3" letter-spacing="6">FINANCE</text>
        <line x1="250" y1="140" x2="650" y2="140" stroke="#E2D8B3" stroke-width="2" opacity="0.6"/>
        <text x="250" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#E2D8B3" letter-spacing="8">NEXUS SOFTWARE STUDIOS</text>
      </svg>
    </div>

    <h2 class="register-title">Register Account</h2>

    <!-- Formulario de Registro -->
    <form (ngSubmit)="onSubmit()" class="register-form">
      
      <div class="form-group">
        <label for="nombre">Full Name</label>
        <input 
          type="text" 
          id="nombre" 
          [(ngModel)]="nombre" 
          name="nombre" 
          placeholder="Your full name" 
          required 
          autocomplete="off">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="Your email address" 
          required 
          autocomplete="off">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="Create a password" 
          required>
      </div>

      <button type="submit" class="btn-register">Register</button>

    </form>

    <!-- Pie de página con enlace al Login -->
    <div class="register-footer">
      <span>Already have an account? </span>
      <a routerLink="/login" class="login-link">Login</a>
    </div>

  </div>
</div>
