<div style="padding: 2rem; font-family: sans-serif;">
  <h1>¡Bienvenido al Panel de Control! </h1>
  
  <div *ngIf="usuario" style="background: #e9ecef; padding: 1rem; border-radius: 8px; margin-top: 1rem;">
    <p><strong>Nombre:</strong> {{ usuario.nombre }}</p>
    <p><strong>Correo:</strong> {{ usuario.email }}</p>
    <p><strong>Rol:</strong> {{ usuario.rol }}</p>
  </div>

  <button 
    (click)="cerrarSesion()" 
    style="margin-top: 1.5rem; padding: 0.6rem 1.2rem; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
    Cerrar Sesión
  </button>
</div>
